const esc=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8));
const makeHidden=(scope,chapterId=null)=>({id:id(),scope,chapterId,title:scope==='goal'?'Unexpected Momentum':'Silent Grinder',description:scope==='goal'?'你在不经意间迈出了重要的一步。':'有些努力，只有系统偷偷记得。',xp:scope==='goal'?160:100,unlocked:false,kind:'semantic',metadata:{source:'mock-ai'},mockRule:scope==='goal'?'goal-completed-3':'chapter-completed-3'});
function chapterFactory(name,description,index){return{id:id(),title:name,description,index,generated:false,tasks:[],hidden:[],batches:0};}
function typeOfGoal(text){return/英语|雅思|ielts|english/i.test(text)?'english':/程序|编程|python|开发|code/i.test(text)?'coding':/运动|健身|跑步|fitness/i.test(text)?'fitness':'general';}
function createGoal(description,title){const type=typeOfGoal(description),parts=CHAPTERS[type];return{id:id(),title:title||description.slice(0,45),description,type,createdAt:Date.now(),chapters:parts.map((p,i)=>chapterFactory(p[0],p[1],i)),hidden:[makeHidden('goal')],metadata:{source:'mock-ai',version:1}};}
function freshState(){const g=createGoal('我要从零基础学英语，最终达到雅思9分','从英语零基础到 IELTS 9');return{version:2,goals:[g],selectedGoalId:g.id,selectedChapterId:g.chapters[0].id,view:'dashboard',evilMode:true};}
let s;try{s=JSON.parse(localStorage.getItem(KEY));if(!s||![1,2].includes(s.version)||!Array.isArray(s.goals)||!s.goals.length)throw new Error('Invalid state');if(s.version===1){s.version=2;s.evilMode=true;}if(typeof s.evilMode!=='boolean')s.evilMode=true;if(!['dashboard','achievements','review','settings'].includes(s.view))s.view='dashboard';}catch(e){s=freshState();}
let modal=null,toastTimer=null,onlyCompleted=false,achTab='all';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){notify('本地存储不可用，请检查浏览器设置。',true);}}
function goal(){return s.goals.find(g=>g.id===s.selectedGoalId)||s.goals[0];}
function chapter(){const g=goal();return g.chapters.find(c=>c.id===s.selectedChapterId)||g.chapters[0];}
function xp(g){let total=0;g.chapters.forEach(c=>c.tasks.forEach(t=>{if(t.completed)total+=XP[t.difficulty].task+XP[t.difficulty].achievement}));const hidden=[...g.hidden,...g.chapters.flatMap(c=>c.hidden)];hidden.forEach(h=>{if(h.unlocked)total+=h.xp;});return total;}
function getAllTasks(g){return g.chapters.flatMap(c=>c.tasks)}
function chapterProgress(c){return c.generated&&c.tasks.length?c.tasks.filter(t=>t.completed).length/c.tasks.length*100:0;}
function realProgress(g){return Math.round(g.chapters.reduce((sum,c)=>sum+chapterProgress(c),0)/g.chapters.length);}
function shownProgress(value){return s.evilMode&&value>=99?'99.9':String(value);}
function hiddenList(g){return [...g.hidden,...g.chapters.flatMap(c=>c.hidden)];}
function mockEvaluateHidden(g){const previously=new Set(hiddenList(g).filter(h=>h.unlocked).map(h=>h.id));const all=getAllTasks(g),completed=all.filter(t=>t.completed).length;hiddenList(g).forEach(h=>{let eligible=false;if(h.mockRule==='goal-completed-3')eligible=completed>=3;else if(h.mockRule==='chapter-completed-3'){const c=g.chapters.find(c=>c.id===h.chapterId);eligible=!!c&&c.tasks.filter(t=>t.completed).length>=3;}h.unlocked=eligible;});const newly=hiddenList(g).filter(h=>h.unlocked&&!previously.has(h.id));if(newly.length)notify('✦ HIDDEN ACHIEVEMENT UNLOCKED：'+newly.map(h=>h.title).join('、')+'（Mock AI）');}
function makeTask(row){return{id:id(),title:row[0],description:row[1],difficulty:row[2],completed:false,achievement:{id:id(),title:row[3]||('Achievement: '+row[0]),unlocked:false},metadata:{source:'mock-ai'}}}
function templateFor(g,c){let group=TASKS[g.type]||TASKS.general;if(!group[c.index])group=TASKS.general;return group[c.index]||TASKS.general[0];}
function generateTasks(g,c,regenerate=false){const template=templateFor(g,c);if(regenerate){c.tasks=c.tasks.filter(t=>t.completed);c.batches=0;}const used=new Set(c.tasks.map(t=>t.title));let added=0;let source=template.filter(r=>!used.has(r[0]));const want=regenerate?4:Math.min(c.generated?2:4,source.length);for(const row of source.slice(0,want)){c.tasks.push(makeTask(row));added++;}
 if(c.generated&&!regenerate&&added===0){const generic=['独立练习并记录一次新进展','复盘一个难点，记录改进方法'];for(const t of generic){const title=t+' · '+(c.batches+1);if(!used.has(title)){c.tasks.push(makeTask([title,'延伸挑战：通过自己的方式完成任务。','medium','Bonus Explorer']));added++;}}}
 c.generated=true;c.batches++;if(!c.hidden.length)c.hidden.push({...makeHidden('chapter',c.id),title:c.index===0?'First Secret':'Quiet Persistence'});mockEvaluateHidden(g);persist();return added;}
function switchChapter(chapterId){s.selectedChapterId=chapterId;s.view='dashboard';persist();render();}
function switchGoal(goalId){s.selectedGoalId=goalId;s.selectedChapterId=goal().chapters[0].id;s.view='dashboard';persist();render();}

function tasksCard(g,c){const done=c.tasks.filter(t=>t.completed).length,total=c.tasks.length,progress=Math.round(chapterProgress(c));return `<div class="card"><div class="card-head"><div class="head-flex"><div><div class="card-label">ACTIVE CHAPTER · ${String(c.index+1).padStart(2,'0')}</div><h2 class="card-title">${esc(c.title)}</h2><p class="card-muted">${esc(c.description)}</p></div><span class="chapter-badge">${c.generated?'QUESTS LOADED':'NOT GENERATED'}</span></div><div class="progress-row"><span>${c.generated?'Completed '+done+' / '+total+' tasks':'章节暂未生成任务'}</span><strong>${shownProgress(progress)}%</strong></div><div class="progress-track"><div style="width:${s.evilMode&&progress>=99?99.9:progress}%"></div></div>${s.evilMode&&progress===100?'<p style="color:#f3b9a1;font-size:10px;margin:10px 0 0">Congratulations! You are just 0.1% away from a mysterious final reward... 🤫</p>':''}</div>${c.generated?`<div class="tasks">${c.tasks.length?c.tasks.filter(t=>!onlyCompleted||t.completed).map((t,i)=>taskHTML(t,i)).join(''):'<div class="empty-small" style="padding:30px">没有符合条件的任务。</div>'}</div><div class="task-footer"><div><button class="btn small ghost" data-action="add-task">＋ Add Task</button><button class="btn small ghost" data-action="filter">${onlyCompleted?'显示全部':'仅看已完成'}</button></div><div style="display:flex;gap:6px"><button class="linkish" data-action="regenerate" title="保留已完成任务，刷新未完成任务">↻ Regenerate</button><button class="linkish" data-action="load-more">＋ Generate More</button></div></div>`:`<div class="empty"><div class="empty-glyph">⬡</div><div class="empty-title">本章任务尚未生成</div><p class="empty-description">按你的需求，系统先生成章节大纲。进入章节后，才按需生成 Task、普通 Achievement 和隐藏成就。</p><button class="btn primary" data-action="generate">⚡ Mock Generate Tasks</button><p style="font-size:10px;color:#748791;margin-top:14px">本按钮不请求网络，不消耗 API Key。</p></div>`}</div>`;}

function achievementsPage(g){const regular=g.chapters.flatMap(c=>c.tasks.map(t=>({...t.achievement,difficulty:t.difficulty,from:c.title,unlocked:t.completed,xp:XP[t.difficulty].achievement}))),hidden=hiddenList(g).map(h=>({...h,from:h.scope==='goal'?'GLOBAL':(g.chapters.find(c=>c.id===h.chapterId)||{}).title||'Chapter',secret:true}));const all=[...regular,...hidden].filter(a=>achTab==='all'||(achTab==='hidden'&&a.secret)||(achTab==='unlocked'&&a.unlocked));return `<div class="eyebrow">TROPHY ROOM / COLLECTION</div><h1 class="hero-title">Your <em>achievements.</em></h1><p class="hero-desc">每个 Task 对应一个普通 Achievement；隐藏成就另行生成。注意：当前 Hidden Judgment 是本地 Mock，而不是 AI API。</p><div class="top-segment"><button class="seg-btn ${achTab==='all'?'active':''}" data-action="ach-tab" data-tab="all">全部 ${regular.length+hidden.length}</button><button class="seg-btn ${achTab==='unlocked'?'active':''}" data-action="ach-tab" data-tab="unlocked">已解锁 ${[...regular,...hidden].filter(a=>a.unlocked).length}</button><button class="seg-btn ${achTab==='hidden'?'active':''}" data-action="ach-tab" data-tab="hidden">隐藏成就 ${hidden.length}</button></div><div class="ach-grid">${all.map((a,i)=>`<div class="ach-card ${a.unlocked?'':'locked'}"><div class="ach-emoji">${a.unlocked?'✦':'◇'}</div><div><div class="ach-name">${esc(a.title)}</div><div class="ach-detail">${esc(a.secret?a.description:'完成对应任务后解锁')}<br>${esc(a.from)} · ${a.secret?'SECRET':'TASK ACHIEVEMENT'}</div><div class="ach-lock">${a.unlocked?'UNLOCKED · +'+a.xp+' XP':a.secret?'LOCKED · 条件隐藏':'LOCKED · 任务未完成'}</div></div></div>`).join('')||'<div class="empty-small">暂无成就，去生成一个章节吧。</div>'}</div><div style="margin-top:24px"><button class="btn ghost" data-action="view" data-view="dashboard">← Back to Quest Board</button></div>`;}
function reviewPage(g){return `<div class="eyebrow">PRODUCT REVIEW / SPEC CHECK</div><h1 class="hero-title">Rules worth <em>challenging.</em></h1><p class="hero-desc">这不是已经确认的后端接口，仅用于审查交互方向。当前不会调用真实 AI。</p><div class="grid-main"><div class="card"><div class="card-head"><div class="card-label">IMPLEMENTED IN THIS MOCK</div><h2 class="card-title">已在原型中实现</h2></div><div class="review-list">✓ 多 Goal、多 Chapter，可随时跳章<br>✓ 进入章节后按需生成模拟任务（可继续生成）<br>✓ Task ↔ 普通 Achievement 一对一<br>✓ 完成和撤销防重复 XP，已完成先撤销才能编辑／删除<br>✓ Task XP 与 Achievement XP 独立计算<br>✓ 预生成隐藏成就：名称/描述可见、条件隐藏<br>✓ Mock 隐藏成就判定；撤销条件时重新锁定并扣回 XP<br>✓ 编辑、添加、删除、重新生成未完成任务<br>✓ LocalStorage 刷新后保留进度<br>✓ Evil UX：完成 100% 时界面恶意显示为 99.9%</div></div><div><div class="card"><div class="card-head"><div class="card-label">PENDING BACKEND</div><h2 class="card-title">尚未实现</h2></div><div class="review-list">○ 主办方真实 AI API / Base URL / 模型名称<br>○ AI 返回结构化 JSON 和 Schema 校验<br>○ 真正的语义隐藏成就 AI 判定<br>○ API 失败时的错误处理与重试<br>○ 登录、多设备同步、数据库<br>○ B 同学的最终 Prompt 与 D 同学接口联调</div></div><div class="review-note"><h3>需审查的 3 个问题</h3><p>① XP 双重奖励的具体数值你希望怎样分配？<br>② AI 可以生成多少 Hidden Achievement？模型输出异常如何裁剪？<br>③ 真实 AI API 无 Base URL，谁联系主办方获取文档？</p></div></div></div><div style="margin-top:23px"><button class="btn ghost" data-action="view" data-view="dashboard">← Back to Quest Board</button></div>`;}

function settingsPage(g){return `<div class="eyebrow">SETTINGS / EXPERIENCE CONTROL</div><h1 class="hero-title">Your game. <em>Your rules.</em></h1><p class="hero-desc">在这里管理演示体验与本地保存选项。Evil UX 默认开启；你可以随时关闭，且不会影响真实完成状态、成就或 XP。</p><div class="card" style="max-width:800px"><div class="card-head"><div class="card-label">EXPERIENCE PREFERENCES</div><h2 class="card-title">😈 Evil UX Mode</h2><p class="card-muted">当前演示的反模式：即使全部任务完成，进度仍故意显示为 99.9%。此效果只改变显示结果，并不会篡改保存的真实进度。</p></div><div style="padding:23px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><div style="font-weight:800;font-size:14px">Enable Evil UX</div><p class="card-muted" style="margin-top:8px">默认开启 · 关闭后会显示真实进度。</p></div><button class="switch ${s.evilMode?'on':''}" data-action="evil" aria-pressed="${s.evilMode}" aria-label="${s.evilMode?'关闭':'开启'} Evil UX"><span style="color:${s.evilMode?'var(--mint)':'#a9b8c2'}">${s.evilMode?'ON':'OFF'}</span><span class="track"></span></button></div></div><div class="card" style="max-width:800px;margin-top:20px"><div class="card-head"><div class="card-label">DATA & PRIVACY</div><h2 class="card-title">Local Storage</h2><p class="card-muted">所有 Goal、Task、Achievement、XP 和当前设置保存在本浏览器的 LocalStorage 中。没有账号、数据库或跨设备同步。清除浏览器网站数据会导致本地记录丢失。</p></div><div style="padding:18px 24px;color:#96a9ae;font-size:12px">Status: LOCAL SAVE ONLY · AI: MOCK / OFFLINE</div></div><div style="margin-top:24px"><button class="btn ghost" data-action="view" data-view="dashboard">← Back to Quest Board</button></div>`;}
function render(){const g=goal();document.getElementById('app').innerHTML=`<div class="shell">${sidebar(g)}<div class="workspace">${header(g)}<div class="content">${s.view==='achievements'?achievementsPage(g):s.view==='review'?reviewPage(g):s.view==='settings'?settingsPage(g):dashboard(g)}<div class="footer">ACHIEVEMENT UNLOCKED · HACKATHON TRACK 2 · INTERACTIVE HTML PROTOTYPE<br>MOCK DATA ONLY. No backend requests, no real AI judgment, no account required.</div></div></div></div><div id="modal-root"></div><div id="toast-container" role="status" aria-live="polite"></div>`;if(modal)renderModal();}
function openModal(kind,taskId){modal={kind,taskId};renderModal();}
function closeModal(){modal=null;document.getElementById('modal-root').innerHTML='';}
function renderModal(){const root=document.getElementById('modal-root');if(!modal){root.innerHTML='';return;}let body='';const g=goal(),c=chapter();if(modal.kind==='new-goal'){body=`<div class="card-label">CREATE A NEW QUEST</div><h2>What do you want to achieve?</h2><p>用自然语言输入目标；本原型根据关键词套用 Mock 章节，不调用真实 AI。</p><form id="goal-form"><label class="field-label" for="goal-description">GOAL DESCRIPTION</label><textarea id="goal-description" name="description" class="field" placeholder="例如：我想从零开始学 Python，做出一个自己的项目" maxlength="600" required></textarea><div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">取消</button><button type="submit" class="btn primary">Create Mock Quest →</button></div></form>`;}
else if(modal.kind==='edit-task'||modal.kind==='add-task'){const t=c.tasks.find(t=>t.id===modal.taskId),edit=!!t;body=`<div class="card-label">${edit?'EDIT QUEST':'CREATE CUSTOM QUEST'}</div><h2>${edit?'编辑任务':'添加任务'}</h2><p>${edit?'编辑未完成任务时，对应普通成就将同步更新。':'手动添加内容不会触发真实 AI 调用。'}</p><form id="task-form"><label class="field-label" for="task-title">TASK TITLE</label><input class="field" id="task-title" name="title" value="${edit?esc(t.title):''}" required maxlength="120"/><label class="field-label" for="task-desc">DESCRIPTION</label><textarea class="field" id="task-desc" name="description" required maxlength="500">${edit?esc(t.description):''}</textarea><label class="field-label" for="task-difficulty">DIFFICULTY</label><select class="field" id="task-difficulty" name="difficulty"><option value="easy" ${edit&&t.difficulty==='easy'?'selected':''}>Easy · 40 Task XP + 60 Achievement XP</option><option value="medium" ${edit&&t.difficulty==='medium'?'selected':''}>Medium · 80 Task XP + 120 Achievement XP</option><option value="hard" ${edit&&t.difficulty==='hard'?'selected':''}>Hard · 140 Task XP + 200 Achievement XP</option></select><label class="field-label" for="task-achievement">ACHIEVEMENT TITLE</label><input class="field" id="task-achievement" name="achievement" value="${edit?esc(t.achievement.title):''}" maxlength="100" placeholder="例如：First Steps" required/><div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">取消</button><button type="submit" class="btn primary">${edit?'Save Changes':'Add Task'}</button></div></form>`;}
else if(modal.kind==='delete-task'){const t=c.tasks.find(t=>t.id===modal.taskId);body=`<div class="card-label">CONFIRM ACTION</div><h2>删除任务？</h2><p>删除「${esc(t?.title)}」也会删除其对应的普通成就。此操作不能撤销。</p><div class="modal-actions"><button class="btn ghost" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-delete">删除任务</button></div>`;}
else if(modal.kind==='regenerate'){body=`<div class="card-label">REGENERATE TASKS</div><h2>重新生成本章？</h2><p>保留所有已完成任务及普通成就，只替换未完成的任务。已解锁隐藏成就的保留策略在真实系统中仍需进一步审查。</p><div class="modal-actions"><button class="btn ghost" data-action="close-modal">取消</button><button class="btn warning" data-action="confirm-regen">Mock Regenerate</button></div>`;}
root.innerHTML=`<div class="modal-bg" id="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(modal.kind)}">${body}</div></div>`;setTimeout(()=>root.querySelector('input,textarea')?.focus(),30);}
function getTask(idValue){return chapter().tasks.find(t=>t.id===idValue)}
function act(element){const action=element.dataset.action,taskId=element.dataset.id,g=goal(),c=chapter();if(action==='view')setView(element.dataset.view);else if(action==='chapter')switchChapter(taskId);else if(action==='goal')switchGoal(taskId);else if(action==='new-goal')openModal('new-goal');else if(action==='close-modal')closeModal();else if(action==='evil'){s.evilMode=!s.evilMode;persist();render();notify(s.evilMode?'Evil UX 已开启：进度可能被故意卡在 99.9%。':'Evil UX 已关闭：现在显示真实进度。');}else if(action==='generate'||action==='load-more'){const n=generateTasks(g,c);render();notify('Mock AI：生成了 '+n+' 个任务。');}else if(action==='filter'){onlyCompleted=!onlyCompleted;render();}else if(action==='complete'){const t=getTask(taskId);if(!t)return;t.completed=!t.completed;t.achievement.unlocked=t.completed;mockEvaluateHidden(g);persist();render();if(t.completed)notify('任务已完成 · '+t.achievement.title+' · +'+(XP[t.difficulty].task+XP[t.difficulty].achievement)+' XP');else notify('任务完成已撤销，相关 XP 与成就已重新计算。',true);}else if(action==='edit-task'){const t=getTask(taskId);if(!t)return;if(t.completed)return notify('已完成任务必须先撤销，才能编辑。',true);openModal('edit-task',taskId);}else if(action==='delete-task'){const t=getTask(taskId);if(!t)return;if(t.completed)return notify('已完成任务必须先撤销，才能删除。',true);openModal('delete-task',taskId);}else if(action==='add-task')openModal('add-task');else if(action==='confirm-delete'){c.tasks=c.tasks.filter(t=>t.id!==modal.taskId);closeModal();mockEvaluateHidden(g);persist();render();notify('任务与对应普通成就已删除。');}else if(action==='regenerate')openModal('regenerate');else if(action==='confirm-regen'){const n=generateTasks(g,c,true);closeModal();render();notify('已保留完成任务，重新生成 '+n+' 个 Mock 任务。');}else if(action==='ach-tab'){achTab=element.dataset.tab;render();}}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target){act(target);return;}if(event.target.id==='modal-overlay')closeModal();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal){closeModal();return;}if((event.key==='Enter'||event.key===' ')&&event.target.matches('[role="button"][data-action]')){event.preventDefault();act(event.target);}});
document.addEventListener('submit',event=>{if(event.target.id==='goal-form'){event.preventDefault();const form=event.target,description=String(new FormData(form).get('description')||'').trim();if(!description)return;const newGoal=createGoal(description,description.length>38?description.slice(0,38)+'…':description);s.goals.unshift(newGoal);s.selectedGoalId=newGoal.id;s.selectedChapterId=newGoal.chapters[0].id;s.view='dashboard';closeModal();persist();render();notify('新 Goal 已创建：章节大纲为 Mock 生成。');}else if(event.target.id==='task-form'){event.preventDefault();const f=new FormData(event.target),title=String(f.get('title')||'').trim(),desc=String(f.get('description')||'').trim(),difficulty=String(f.get('difficulty')||'medium'),achName=String(f.get('achievement')||'').trim();if(!title||!desc||!achName||!XP[difficulty])return;if(modal.kind==='edit-task'){const t=getTask(modal.taskId);if(!t||t.completed){notify('已完成任务不能直接修改。',true);return;}t.title=title;t.description=desc;t.difficulty=difficulty;t.achievement.title=achName;}else{const t=makeTask([title,desc,difficulty,achName]);chapter().tasks.push(t);chapter().generated=true;}closeModal();persist();render();notify('任务与对应 Achievement 已保存。');}});
persist();render();
</script>
</body>
</html>
